[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lidar-video"
version = "0.5.0"
description = "Measured RGB-D bridge to RoboSkills, scene graphs, and Scenic"
requires-python = ">=3.11"
dependencies = ["networkx>=3.2,<4", "numpy>=1.26", "scipy>=1.10", "pillow>=10", "mujoco>=3.5", "scenic>=3.1,<4", "opencv-python>=4.10", "lzfse>=0.4", "coacd>=1.0", "fast-simplification>=0.1", "python-chess>=1.999", "scikit-learn>=1.5", "scikit-image>=0.26", "trimesh>=4.5", "roboskills @ git+https://github.com/openrobokit/roboskills.git@eca4691d2dfbb808dd58f3dd279fed154de6828a"]

[project.optional-dependencies]
diagnostics = ["matplotlib>=3.8", "rtree>=1.2"]
test = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
lidar-video = "lidar_video.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
